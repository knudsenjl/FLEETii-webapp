# Required check for the staging (main) -> production promotion path — see
# CLAUDE.md's "Environments" section. Node version matches Netlify's actual
# Functions runtime (nodejs22.x), not just whatever's installed locally, so a
# green run here means the same thing a real deploy would.
name: CI

on:
  pull_request:
    branches: [production]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
