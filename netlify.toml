[build]
  command = "npm run build"
  publish = "dist"

# Pin the framework dev-server port `netlify dev` proxies to. Without this,
# netlify dev auto-detects by polling Vite's default port (5173) — if a
# sibling project's Vite server already happens to be listening there, it
# gets mistaken for this project's and localhost:8888 silently serves the
# wrong app instead. Must match vite.config.ts's server.port.
[dev]
  targetPort = 5183

[functions]
  directory = "netlify/functions"

# Client-side routing (React Router) — without this, refreshing or
# directly opening any route other than "/" 404s, since Netlify otherwise
# looks for a matching static file instead of letting the SPA handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Applies to the whole SPA — stops the app being embedded in an <iframe> on
# someone else's site (a cheap way to "skin"/clone a UI without copying any
# code), on top of the LICENSE's own ownership notice.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The bulk-import CSV templates (public/templates/bulk-import/*.csv, linked
# from ImportUsersPage.tsx) would otherwise be served as text/csv, which
# browsers have no built-in renderer for — clicking the link just downloads
# the file instead of previewing it, unlike its JSON/README.md siblings.
# Overriding to text/plain makes it display inline the same way.
[[headers]]
  for = "/templates/bulk-import/*.csv"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Vite content-hashes every filename under /assets/* (e.g.
# index-Dfll3UuY.js) — any change to a file's content produces a new URL,
# so it's safe for a repeat visitor's browser to cache these forever
# instead of re-fetching them on every deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# sw.js (vite-plugin-pwa's generated service worker) controls how the
# whole precached app shell gets updated — unlike /assets/*, its filename
# never changes, so caching it long-term would delay every future app
# update reaching already-installed users. must-revalidate makes the
# browser check for a fresh copy on every load instead.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
