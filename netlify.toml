[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Client-side routing (React Router) — without this, refreshing or
# directly opening any route other than "/" 404s, since Netlify otherwise
# looks for a matching static file instead of letting the SPA handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bulk-import CSV templates (public/templates/bulk-import/*.csv, linked
# from ImportUsersPage.tsx) would otherwise be served as text/csv, which
# browsers have no built-in renderer for — clicking the link just downloads
# the file instead of previewing it, unlike its JSON/README.md siblings.
# Overriding to text/plain makes it display inline the same way.
[[headers]]
  for = "/templates/bulk-import/*.csv"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
